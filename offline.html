<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8FAFC"><title>Vertex — offline</title>
<style>:root{color-scheme:light;--bg:#F8FAFC;--surface:#fff;--text:#0F172A;--muted:#64748B;--border:#DBE3EE;--accent:#2563EB}html[data-theme=dark]{color-scheme:dark;--bg:#0B1120;--surface:#111827;--text:#F8FAFC;--muted:#94A3B8;--border:#1F2937;--accent:#3B82F6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Geist,Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{max-width:600px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:clamp(24px,6vw,52px)}.brand{display:flex;align-items:center;gap:12px;font-family:'Geist Mono',monospace;letter-spacing:.16em;font-weight:700}img{width:48px;height:48px;object-fit:contain}h1{font-size:clamp(2rem,7vw,3.6rem);letter-spacing:-.055em;line-height:1.05;margin:40px 0 22px}p{color:var(--muted);line-height:1.7}button,a{font:inherit;font-weight:600;border:1px solid var(--border);border-radius:12px;padding:14px 20px;display:inline-block;cursor:pointer;text-decoration:none}button{background:var(--accent);color:#fff}a{color:var(--text);background:var(--surface)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.status{min-height:24px;font-size:.88rem}</style>
<script>(()=>{const theme=localStorage.getItem('vertex-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=theme;document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#0B1120':'#F8FAFC'})();</script></head>
<body><main><div class="brand"><img src="/assets/logo.png" alt="Vertex logo">VERTEX</div><h1>Your connection<br>will catch up.</h1><p>Vertex is offline. Your account and competition work need a connection, so this page does not show saved private information.</p><p>Reconnect to see current deadlines, open your submissions and continue where you left off.</p><div class="actions"><button type="button" id="retry">Try again</button><a href="/discover">Open discovery</a></div><p class="status" id="status" role="status" aria-live="polite"></p></main>
<script>const status=document.querySelector('#status');document.querySelector('#retry').addEventListener('click',()=>location.reload());addEventListener('online',()=>status.textContent='Connection detected. Choose Try again to continue.');addEventListener('offline',()=>status.textContent='Still offline. Reconnect and try again.');</script></body></html>
