ng Vertex</p></div></div></div><div id="app" aria-live="polite" inert></div><noscript><style>.vertex-splash{display:none}</style><main class="boot"><h1>JavaScript is required</h1><p>Enable JavaScript in your browser to open Vertex.</p></main></noscript><script src="/config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js" defer></script><script id="vertex-app-script" type="module" src="/js/app.js"></script><script>document.querySelector("#vertex-app-script").addEventListener("error",()=>{const splash=document.querySelector("#vertex-splash");splash.setAttribute("role","alert");splash.setAttribute("aria-label","Vertex startup problem");splash.querySelector(".splash-loading")?.remove();const heading=document.createElement("h1");heading.className="splash-error-title";heading.textContent="Vertex could not open.";splash.querySelector(".splash-status").before(heading);splash.querySelector("[data-boot-status]").textContent="Check your connection and try again.";const button=document.createElement("button");button.type="button";button.className="button primary";button.textContent="Try again";button.onclick=()=>location.reload();splash.querySelector(".splash-identity").append(button);button.focus()});</script></body></html>
